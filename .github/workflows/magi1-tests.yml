name: MAGI1 Tests

on:
  pull_request:
    paths:
      - 'magi1/**'
      - 'requirements.txt'
      - '.github/workflows/magi1-tests.yml'
  push:
    branches: [main]
    paths:
      - 'magi1/**'
      - 'requirements.txt'
      - '.github/workflows/magi1-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile all MAGI1 modules
        run: python -m compileall -q magi1
      - name: MAGI1 regression suite
        run: python -m unittest discover -s magi1/tests -v
