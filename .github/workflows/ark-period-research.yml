name: ARK Full Period Public Data Research
on:
  push:
    branches: [research/ark-daily-20260911]
    paths:
      - research/ark_period_20260911/policy.json
      - research/ark_period_20260911/collect.py
      - .github/workflows/ark-period-research.yml
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ark-daily-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public ARK candles only
        run: PYTHONPATH=. python research/ark_period_20260911/collect.py
      - name: Archive public research data on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ark_period_20260911/data
          git diff --cached --quiet || git commit -m 'Archive ARK full-period public candle snapshot'
          git push origin HEAD:research/ark-daily-20260911
