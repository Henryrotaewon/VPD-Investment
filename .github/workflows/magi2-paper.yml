name: MAGI 2 Paper Execution

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "MAGI2 command"
        required: true
        default: report
        type: choice
        options:
          - morning
          - refill
          - report
  workflow_run:
    workflows: ["VPD Scanner v1.6"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: magi2-paper
  cancel-in-progress: false

jobs:
  paper:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify MAGI2 state continuity
        run: |
          mkdir -p magi2/state
          if [ ! -f magi2/state/paper_state.json ]; then
            echo "MAGI2 state missing. Refusing to initialize a blank paper account." >&2
            exit 1
          fi
      - name: Resolve MAGI2 mode
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            MODE=$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          p=Path('data/vpd_latest.json')
          mode='monitor'
          if p.exists():
              s=json.loads(p.read_text(encoding='utf-8'))
              raw=s.get('asof')
              if raw:
                  dt=datetime.fromisoformat(raw)
                  if dt.hour==7:
                      mode='morning'
          print(mode)
          PY
          )
          else
            MODE="monitor"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved MAGI2 mode: $MODE"
      - name: Run MAGI2 PAPER
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python magi2/paper_engine.py "${{ steps.resolve.outputs.mode }}"
      - name: Persist MAGI2 paper state and trade log
        if: always()
        run: |
          git config user.name "magi2-bot"
          git config user.email "magi2-bot@users.noreply.github.com"
          mkdir -p magi2/state
          files=""
          [ -f magi2/state/paper_state.json ] && files="$files magi2/state/paper_state.json"
          [ -f magi2/state/paper_events.jsonl ] && files="$files magi2/state/paper_events.jsonl"
          if [ -n "$files" ]; then
            git add $files
            if ! git diff --cached --quiet; then
              git commit -m "MAGI2 paper state update [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          fi
