name: MAGI 2 Paper Execution

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VPD Scanner v1.6"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: magi2-paper
  cancel-in-progress: false

jobs:
  paper:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MAGI2 paper monitor and Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python magi2/paper_engine.py
      - name: Persist MAGI2 paper state and trade log
        if: always()
        run: |
          git config user.name "magi2-bot"
          git config user.email "magi2-bot@users.noreply.github.com"
          git add magi2/state/paper_state.json magi2/state/paper_events.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "MAGI2 paper state update [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
