name: ARK Exit Reference Read Only
on:
  push:
    branches: [research/ark-daily-20260911]
    paths: [.github/workflows/ark-exit-case.yml]
permissions: {}
jobs:
  public-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public ARK candles without authentication
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          url = "https://api.upbit.com/v1/candles/days?market=KRW-ARK&to=2026-09-17T00%3A00%3A00Z&count=3"
          request = urllib.request.Request(url, headers={"Accept":"application/json"})
          with urllib.request.urlopen(request, timeout=25) as response:
              rows = json.load(response)
          assert len(rows)==3 and all(r["market"]=="KRW-ARK" for r in rows)
          result = {"source":url, "retrieved_at":datetime.now(timezone.utc).isoformat(), "market":"KRW-ARK",
                    "columns":["candle_date_time_utc","opening_price","high_price","low_price","trade_price","candle_acc_trade_volume","candle_acc_trade_price"],
                    "candles":[[r[k] for k in ["candle_date_time_utc","opening_price","high_price","low_price","trade_price","candle_acc_trade_volume","candle_acc_trade_price"]] for r in sorted(rows,key=lambda r:r["candle_date_time_utc"])]}
          print("ARK_EXIT_DATA="+json.dumps(result,separators=(",",":")))
          PY
