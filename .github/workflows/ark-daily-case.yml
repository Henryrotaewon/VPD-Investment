name: ARK completed daily case data
on:
  pull_request:
    paths: ['.github/workflows/ark-daily-case.yml']
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public candles only
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, time, hashlib
          def get(end,count):
              q=urllib.parse.urlencode(dict(market='KRW-ARK',count=count,to=end))
              url='https://api.upbit.com/v1/candles/days?'+q
              with urllib.request.urlopen(url,timeout=20) as r:
                  data=json.load(r)
              if not isinstance(data,list): raise ValueError('Unexpected public candle response')
              print('SOURCE_URL='+url)
              return data
          training=get('2026-09-12T00:00:00Z',200)
          time.sleep(.25)
          training+=get(training[-1]['candle_date_time_utc']+'Z',200)
          time.sleep(.25)
          outcomes=get('2026-09-16T00:00:00Z',4)
          keys=['candle_date_time_utc','opening_price','high_price','low_price','trade_price','candle_acc_trade_volume','candle_acc_trade_price']
          for label,rows in [('TRAINING',training),('OUTCOMES_ONLY',outcomes)]:
              rows=sorted(rows,key=lambda x:x['candle_date_time_utc'])
              data=json.dumps([[x[k] for k in keys] for x in rows],separators=(',',':'))
              print(label+'_SHA256='+hashlib.sha256(data.encode()).hexdigest())
              print(label+'_COLUMNS='+json.dumps(keys))
              print(label+'_ROWS='+data)
          PY
