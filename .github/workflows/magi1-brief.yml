name: MAGI1 Telegram Brief

on:
  schedule:
    - cron: '30 22 * * *' # 07:30 KST
    - cron: '0 9 * * *'   # 18:00 KST
  workflow_dispatch:
    inputs:
      session:
        description: 'Administrative briefing session'
        required: true
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve briefing session
        id: session
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          else
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR" -lt 12 ]; then SESSION="morning"; else SESSION="evening"; fi
          fi
          echo "value=$SESSION" >> "$GITHUB_OUTPUT"
      - name: Send MAGI1 Telegram brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/magi1_brief.py "${{ steps.session.outputs.value }}"
