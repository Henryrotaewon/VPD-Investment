name: VPD Early Warning POC

on:
  workflow_dispatch:
  schedule:
    # Phase-1 POC: re-check only the small VPD-derived watchlist every 15 minutes.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: vpd-early-warning
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VPD Early Warning watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/early_warning_watch.py
