name: VPD Early Warning Operations

on:
  workflow_dispatch:
  # Early Warning paused during the scheduled VPD PAPER evaluation.
  # Previous schedule: '*/15 * * * *'. Restore only when resuming this experiment.

permissions:
  contents: write

concurrency:
  group: vpd-main-data-writer
  cancel-in-progress: false

jobs:
  watch:
    # Pause manual execution as well; retain code and history for later research.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VPD Early Warning watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/early_warning_watch.py

