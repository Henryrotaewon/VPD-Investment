name: MAGI1 Scan

on:
  schedule:
    - cron: '10 22 * * *' # 07:10 KST
    - cron: '40 8 * * *'  # 17:40 KST
  workflow_dispatch:
    inputs:
      session:
        description: 'Administrative MAGI1 scan session'
        required: true
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions:
  contents: write

concurrency:
  group: magi1-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve MAGI1 session
        id: session
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          else
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR" -lt 12 ]; then SESSION="morning"; else SESSION="evening"; fi
          fi
          echo "value=$SESSION" >> "$GITHUB_OUTPUT"
          echo "MAGI1 session: $SESSION"
      - name: Run MAGI1 scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAGI1_SESSION: ${{ steps.session.outputs.value }}
        run: python scanner/run_vpd_action_v1_6.py
      - name: Refresh scanner outputs
        run: git pull --rebase origin main
      - name: Run WPI5/VWPI5 shadow and 30-day validation
        run: python scanner/wpi5_shadow.py
      - name: Run VWPI5 200-market expanded validation
        run: python scanner/vwpi5_validation_200.py
      - name: Commit shadow validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wpi5_shadow_latest.json data/wpi5_validation_30d.csv data/vwpi5_validation_200_latest.json data/vwpi5_validation_200.csv
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Update WPI5 and VWPI5 validation"
            git push origin main
          fi
      - name: Send Telegram failure alert
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚨 MAGI1 ${{ steps.session.outputs.value }} scan FAILED\nRepo: ${GITHUB_REPOSITORY}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nCommit: ${GITHUB_SHA}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
