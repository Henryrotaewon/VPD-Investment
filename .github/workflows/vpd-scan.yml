name: VPD Scanner v1.4

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    # 07:20 KST = 22:20 UTC (previous calendar day)
    # 17:50 KST = 08:50 UTC
    - cron: '20 22 * * *'
    - cron: '50 8 * * *'

permissions:
  contents: write

concurrency:
  group: vpd-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VPD Scanner and Telegram radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/run_vpd_action.py
