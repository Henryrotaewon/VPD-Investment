name: VPD Scanner v1.5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/vpd-trigger.txt'
  schedule:
    - cron: '20 22 * * *'
    - cron: '50 8 * * *'

permissions:
  contents: write

concurrency:
  group: vpd-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VPD Scanner and Telegram radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/run_vpd_action.py

      - name: Refresh scanner outputs
        run: git pull --rebase origin main

      - name: Run WPI5 shadow and 30-day validation
        run: python scanner/wpi5_shadow.py

      - name: Commit WPI5 shadow outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wpi5_shadow_latest.json data/wpi5_validation_30d.csv
          if git diff --cached --quiet; then
            echo "No WPI5 changes"
          else
            git commit -m "Update WPI5 shadow validation"
            git push origin main
          fi
