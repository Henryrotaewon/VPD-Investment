name: VPD Scanner v1.6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/vpd-trigger.txt'

permissions:
  contents: write

concurrency:
  group: vpd-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run VPD Scanner v1.6 and Telegram radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner/run_vpd_action_v1_6.py
      - name: Refresh scanner outputs
        run: git pull --rebase origin main
      - name: Run WPI5/VWPI5 shadow and 30-day validation
        run: python scanner/wpi5_shadow.py
      - name: Run VWPI5 200-market expanded validation
        run: python scanner/vwpi5_validation_200.py
      - name: Commit shadow validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wpi5_shadow_latest.json data/wpi5_validation_30d.csv data/vwpi5_validation_200_latest.json data/vwpi5_validation_200.csv
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Update WPI5 and VWPI5 validation"
            git push origin main
          fi
      - name: Send Telegram failure alert
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚨 VPD Scanner FAILED\nRepo: ${GITHUB_REPOSITORY}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nEvent: ${GITHUB_EVENT_NAME}\nCommit: ${GITHUB_SHA}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
