name: September Exit Public Data Research
on:
  push:
    branches: [research/ark-daily-20260911]
    paths:
      - research/september_exit_validation/collect.py
      - research/september_exit_validation/policy.json
      - .github/workflows/september-exit-research.yml
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect public data with frozen research rules
        env:
          PYTHONPATH: .
        run: python3 research/september_exit_validation/collect.py
      - name: Archive public research data on the research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/september_exit_validation/data
          git diff --cached --quiet && exit 0
          git commit -m 'Archive September public candles and frozen sample selection'
          git push origin HEAD:research/ark-daily-20260911
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: september-exit-public-data
          path: research/september_exit_validation/data
          retention-days: 30
