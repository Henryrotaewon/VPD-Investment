name: VWPI5 Incremental Effect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/vwpi5-trigger.txt'

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run VWPI5 incremental effect test
        run: python scanner/vwpi5_incremental_effect.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vwpi5_incremental_effect_latest.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update VWPI5 incremental effect result"
            git push origin main
          fi
